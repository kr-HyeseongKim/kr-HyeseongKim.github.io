<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hyeseong Kim</title>
  <meta name="description" content="Hyeseong Kim — research on motivation, self-regulation, and physical activity behavior change.">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Mobile-only top bar -->
  <header class="topbar">
    <a class="topbar-name" href="#top" data-site="name"></a>
    <button class="menu-btn" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>

  <div class="layout" id="top">
    <!-- Left: profile + menu (slides in from the right on mobile) -->
    <aside class="sidebar" id="sidebar">
      <button class="close-btn" type="button" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div class="profile">
        <img class="photo" data-site="photo" alt="">
        <h1 data-site="name"></h1>
        <p class="tagline" data-site="tagline"></p>
        <ul class="links" data-site="links"></ul>
      </div>
      <nav class="nav" aria-label="Sections">
        <ul data-site="nav"></ul>
      </nav>
    </aside>
    <div class="scrim" hidden></div>

    <!-- Right: content -->
    <main class="content">
      <!-- Profile summary shown at the top on mobile only -->
      <div class="mobile-hero">
        <img class="photo" data-site="photo" alt="">
        <div>
          <p class="name" data-site="name"></p>
          <p class="tagline" data-site="tagline"></p>
        </div>
        <ul class="links" data-site="links"></ul>
      </div>
      <div data-site="sections"></div>
      <footer class="footer" data-site="footer"></footer>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="site.js"></script>
</body>
</html>
